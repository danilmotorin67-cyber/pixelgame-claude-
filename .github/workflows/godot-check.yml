name: Godot checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate game data
        run: python3 tools/validate_data.py
      - name: Dialogue coverage (spec 2.4)
        run: python3 tools/dialogue_coverage.py --strict
      - name: Download Godot 4.4.1
        run: |
          curl -fL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import and parse project
        run: |
          ./godot --headless --editor --path . --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-import.log; then
            exit 1
          fi
      - name: Test game systems and regions
        run: |
          ./godot --headless --path . res://tests/integration/test_m1.tscn 2>&1 | tee godot-test.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test.log; then
            exit 1
          fi
      - name: Test M2 household systems
        run: |
          ./godot --headless --path . res://tests/integration/test_m2.tscn 2>&1 | tee godot-test-m2.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test-m2.log; then
            exit 1
          fi
      - name: Test M3 lighthouse systems
        run: |
          ./godot --headless --path . res://tests/integration/test_m3.tscn 2>&1 | tee godot-test-m3.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test-m3.log; then
            exit 1
          fi
      - name: Test M4 graveyard systems
        run: |
          ./godot --headless --path . res://tests/integration/test_m4.tscn 2>&1 | tee godot-test-m4.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test-m4.log; then
            exit 1
          fi
      - name: Test M5 fishing and sea systems
        run: |
          ./godot --headless --path . res://tests/integration/test_m5.tscn 2>&1 | tee godot-test-m5.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test-m5.log; then
            exit 1
          fi
      - name: Test M6 people
        run: |
          ./godot --headless --path . res://tests/integration/test_m6.tscn 2>&1 | tee godot-test-m6.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test-m6.log; then
            exit 1
          fi
      - name: Test M7 crafting and knowledge
        run: |
          ./godot --headless --path . res://tests/integration/test_m7.tscn 2>&1 | tee godot-test-m7.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test-m7.log; then
            exit 1
          fi
      - name: Test M8 the Deep, grottoes and combat
        run: |
          ./godot --headless --path . res://tests/integration/test_m8.tscn 2>&1 | tee godot-test-m8.log
          if grep -E 'SCRIPT ERROR:|ERROR:' godot-test-m8.log; then
            exit 1
          fi
